<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Website Navbar -->
    <header class="navbar">

        <div class="logo">MYNTRA</div>

        <nav class="categories">
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">HOME & LIVING</a>
            <a href="#">BEAUTY</a>
        </nav>

        <input
            type="text"
            class="search"
            placeholder="Search for products, brands and more"
        >

        <div class="user-menu">
            <span>👤 Profile</span>
            <span>♡ Wishlist</span>
            <span>🛍 Bag</span>
        </div>

    </header>

    <!-- Fashion Sale Banner -->
<section class="sale-banner">

    <div class="banner-text">
        <h1>BIG FASHION SALE</h1>
        <p>Discover the latest fashion trends</p>
        <p>Style your day, your way!</p>
    </div>

    <div class="banner-image">
        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80" alt="Fashion shopping">
    </div>

</section>


    <!-- Main Homepage -->
     <!-- Deal of the Day -->
    <section class="products-section">

        <h2>DEAL OF THE DAY</h2>

        <div class="products">

            <div class="product">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" alt="T-shirt">
                <h3>Casual T-Shirt</h3>
                <p>₹499</p>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Shoes">
                <h3>Sports Shoes</h3>
                <p>₹999</p>
            </div>

            <div class="product">
                <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=400" alt="Bag">
                <h3>Stylish Handbag</h3>
                <p>₹799</p>
            </div>

        </div>

    </section>
    <main class="main-content">
        <h1>Welcome to Myntra Clone</h1>
        <p>Fashion for everyone.</p>
    </main>

</body>
</html>

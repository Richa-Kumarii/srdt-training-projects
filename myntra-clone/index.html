<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Website Navbar -->
    <header class="navbar">

        <div class="logo">MYNTRA</div>

        <nav class="categories">
            <a href="#">MEN</a>
            <a href="#">WOMEN</a>
            <a href="#">KIDS</a>
            <a href="#">HOME & LIVING</a>
            <a href="#">BEAUTY</a>
        </nav>

        <input
            type="text"
            class="search"
            placeholder="Search for products, brands and more"
        >

        <div class="user-menu">
            <span>👤 Profile</span>
            <span>♡ Wishlist</span>
            <span>🛍 Bag</span>
        </div>

    </header>

    <!-- Fashion Sale Banner -->
<section class="sale-banner">

    <div class="banner-text">
        <h1>BIG FASHION SALE</h1>
        <p>Discover the latest fashion trends</p>
        <p>Style your day, your way!</p>
    </div>

    <div class="banner-image">
        <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=800&q=80" alt="Fashion shopping">
    </div>

</section>


    <!-- Main Homepage -->
    <main class="main-content">
        <h1>Welcome to Myntra Clone</h1>
        <p>Fashion for everyone.</p>
    </main>

</body>
</html>
